const DATA={"states": [{"id": "BW", "name": "Baden-Württemberg", "capital": "Stuttgart", "city": "Stuttgart", "area": 35748, "pop": 11.24, "leader": "Cem Özdemir", "party": "Grüne", "coalition": ["Grüne", "CDU"], "region": "Südwesten", "fact": "Der Schwarzwald und der Bodensee liegen hier. Viele Menschen arbeiten im Fahrzeugbau.", "source": "https://www.baden-wuerttemberg.de/de/regierung", "note": "", "opposition": {"groups": ["AfD", "SPD"], "source": "https://www.landtag-bw.de/de/der-landtag/fraktionen", "items": [{"party": "SPD", "topic": "Bildung: Kitas", "text": "Die SPD kritisierte schon vor dem Regierungswechsel zu Cem Özdemir: Das Land gebe zu wenig Geld für die Bildung kleiner Kinder aus. Sie fordert mehr Geld für Kitas.", "date": "Januar 2026", "url": "https://www.spd-landtag-bw.de/andreas-kenner-die-landesregierung-muss-mehr-geld-in-fruehkindliche-bildung-investieren"}, {"party": "AfD", "topic": "Wirtschaft: Unternehmen", "text": "Die AfD wirft der Regierung Özdemir vor, wirtschaftliche Stärke zu versprechen, aber Unternehmen durch grüne Politik zu behindern. Das ist die Bewertung der AfD.", "date": "Mai 2026", "url": "https://www.welt.de/regionales/baden-wuerttemberg/article6a0ecdb669c19e49a1a5a0b7/afd-oppositionsfuehrer-nennt-oezdemir-illusionskuenstler.html"}], "note": ""}}, {"id": "BY", "name": "Bayern", "capital": "München", "city": "München", "area": 70542, "pop": 13.25, "leader": "Markus Söder", "party": "CSU", "coalition": ["CSU", "FREIE WÄHLER"], "region": "Südosten", "fact": "Bayern ist das flächenmäßig größte Bundesland. Im Süden liegen die Alpen.", "source": "https://www.bayern.de/staatsregierung/koalitionsvertrag-2023-2028/", "note": "", "opposition": {"groups": ["AfD", "Grüne", "SPD"], "source": "https://www.bayern.landtag.de/aktuelles/aus-dem-plenum/21042026-generaldebatte-im-bayerischen-landtag/", "items": [{"party": "Grüne", "topic": "Bildung und Umwelt", "text": "Die Grünen finden: Die Regierung modernisiert Schulen, Bahnverkehr und Klimaschutz zu langsam. Sie fordern mehr Geld für diese Aufgaben.", "date": "21. April 2026", "url": "https://www.bayern.landtag.de/aktuelles/aus-dem-plenum/21042026-generaldebatte-im-bayerischen-landtag/"}, {"party": "SPD", "topic": "Geld für Familien und Pflege", "text": "Die SPD kritisiert Einsparungen bei Familien und Pflege. Aus ihrer Sicht trifft der Sparkurs besonders Menschen, die Unterstützung brauchen.", "date": "21. April 2026", "url": "https://www.bayern.landtag.de/aktuelles/aus-dem-plenum/21042026-generaldebatte-im-bayerischen-landtag/"}, {"party": "AfD", "topic": "Migration und Staatsausgaben", "text": "Die AfD fordert, bei Migration und Integration stärker zu sparen. Außerdem kritisiert sie, dass alte Schulden kaum noch abgebaut werden.", "date": "21. April 2026", "url": "https://www.bayern.landtag.de/aktuelles/aus-dem-plenum/21042026-generaldebatte-im-bayerischen-landtag/"}], "note": ""}}, {"id": "BE", "name": "Berlin", "capital": "Berlin", "city": "Berlin", "area": 891, "pop": 3.7, "leader": "Kai Wegner", "party": "CDU", "coalition": ["CDU", "SPD"], "region": "Osten", "fact": "Berlin ist eine Stadt und ein Bundesland. Berlin ist auch die Hauptstadt von Deutschland.", "source": "https://www.berlin.de/rbmskzl/politik/senat/senatsmitglieder/", "note": "Nach der Wahl im September 2026 wird über eine neue Regierung verhandelt. Hier steht die bisher amtierende Regierung.", "opposition": {"groups": ["Grüne", "Die Linke", "AfD"], "source": "https://www.parlament-berlin.de/das-parlament/fraktionen", "items": [{"party": "Grüne", "topic": "Bildung und Jugend", "text": "Die Grünen kritisieren Kürzungen im Geldplan für 2026 und 2027. Sie finden: Schulen, Jugendliche und Familien brauchen mehr Unterstützung.", "date": "Haushalt 2026/2027", "url": "https://gruene-fraktion.berlin/pressemitteilungen/haushalt-2026-27-kuerzungen-bei-bildung-jugend-und-familie-sind-ein-fatales-signal/"}, {"party": "Die Linke", "topic": "Hilfe bei Wohnungslosigkeit", "text": "Die Linke kritisierte am Haushaltsplan, dass bei Hilfen für obdachlose Menschen gespart werden sollte. Sie warnt auch vor weniger Hilfe, um Wohnungslosigkeit zu verhindern.", "date": "Haushaltsplanung 2026/2027", "url": "https://www.linksfraktion.berlin/politik/presse/detail/news/koalition-kuerzt-massiv-im-sozialbereich-haerteste-einschnitte-treffen-obdachlose-und-praeventionsprojekte/"}], "note": "Nach der Wahl im September laufen Gespräche über eine neue Regierung. Die Angaben beziehen sich auf den noch amtierenden Senat aus CDU und SPD. Die Beispiele stammen aus der Debatte über dessen Haushalt."}}, {"id": "BB", "name": "Brandenburg", "capital": "Potsdam", "city": "Potsdam", "area": 29654, "pop": 2.55, "leader": "Dietmar Woidke", "party": "SPD", "coalition": ["SPD", "CDU"], "region": "Osten", "fact": "Brandenburg umgibt Berlin. Hier gibt es viele Seen und den Spreewald.", "source": "https://www.brandenburg.de/cms/detail.php/bb1.c.594772.de", "note": "", "opposition": {"groups": ["AfD", "BSW"], "source": "https://www.landtag.brandenburg.de/de/abgeordnete_-_fraktionen/abgeordnete/plenarsitzordnung/25228", "items": [{"party": "BSW", "topic": "Arbeit und Verdienst", "text": "Das BSW vermisst im neuen Regierungsvertrag seine bisherigen Ziele für faire Bezahlung bei öffentlichen Aufträgen. Es kritisiert außerdem den Sparkurs.", "date": "4. März 2026", "url": "https://www.tagesspiegel.de/potsdam/brandenburg/das-wird-nicht-genugen-was-brandenburgs-opposition-vom-neuen-koalitionsvertrag-halt-15316423.html"}, {"party": "AfD", "topic": "Energie, Wohnen und Schule", "text": "Die AfD findet: Der Vertrag von SPD und CDU bietet keine ausreichenden Lösungen für hohe Energiekosten, Mieten und Probleme in der Bildung.", "date": "4. März 2026", "url": "https://www.tagesspiegel.de/potsdam/brandenburg/das-wird-nicht-genugen-was-brandenburgs-opposition-vom-neuen-koalitionsvertrag-halt-15316423.html"}], "note": "Daneben gibt es die Gruppe „Wir für Brandenburg“. Sie gehört nicht zur Koalition und will die Regierung kritisch begleiten. Sie versteht sich aber nicht als grundsätzlich gegen die Regierung gerichtet."}}, {"id": "HB", "name": "Bremen", "capital": "Bremen", "city": "Bremen", "area": 420, "pop": 0.71, "leader": "Andreas Bovenschulte", "party": "SPD", "coalition": ["SPD", "Grüne", "Die Linke"], "region": "Nordwesten", "fact": "Das kleinste Bundesland besteht aus zwei Städten: Bremen und Bremerhaven. Die Häfen sind wichtig.", "source": "https://www.rathaus.bremen.de/", "note": "", "opposition": {"groups": ["CDU", "FDP", "Bündnis Deutschland", "Bürgerallianz Bremen/Bremerhaven (Gruppe)"], "source": "https://bremische-buergerschaft.de/wp2017ticker/36lmi/", "items": [{"party": "CDU", "topic": "Bildung: genug Lehrkräfte", "text": "Die CDU wirft dem Senat vor, den Bedarf an Lehrkräften zu niedrig zu berechnen. Sie fordert eine realistische Planung, damit der Unterricht gesichert ist.", "date": "Juni 2026", "url": "https://sd.bremische-buergerschaft.de/tops/?__=UGhVM0hpd2NXNFdFcExjZeP_tZi6axeA7THlZXPeTec"}, {"party": "FDP", "topic": "Umgang mit Geld", "text": "Die FDP kritisiert die Ausgaben- und Schuldenpolitik des Senats. Sie befürchtet, dass die Menschen in Bremen die finanziellen Probleme am Ende bezahlen müssen.", "date": "August 2026", "url": "https://www.fdp-fraktion-hb.de/buerger-sollen-die-rechnung-fuer-rot-gruen-rotes-finanzversagen-zahlen/"}], "note": ""}}, {"id": "HH", "name": "Hamburg", "capital": "Hamburg", "city": "Hamburg", "area": 755, "pop": 1.87, "leader": "Peter Tschentscher", "party": "SPD", "coalition": ["SPD", "Grüne"], "region": "Norden", "fact": "Hamburg ist eine Stadt und ein Bundesland. Die Stadt an der Elbe hat einen großen Hafen.", "source": "https://www.hamburg.de/politik-und-verwaltung/aktuelles/peter-tschentscher-bleibt-erster-buergermeister-1055528", "note": "", "opposition": {"groups": ["CDU", "Die Linke", "AfD"], "source": "https://www.hamburgische-buergerschaft.de/ueber-uns/fraktionen", "items": [{"party": "CDU", "topic": "Verkehr: Parkgebühren", "text": "Die CDU kritisiert höhere Parkgebühren. Sie findet: Dadurch werden Menschen mit Auto zusätzlich belastet. Auch Geschäfte könnten darunter leiden.", "date": "Juli 2026", "url": "https://cduhh.de/author/philipp-heissner/"}, {"party": "Die Linke", "topic": "Wohnen: bezahlbare Mieten", "text": "Die Linke findet: Der Senat plant zu wenige günstige Wohnungen. Öffentliche Grundstücke sollten aus ihrer Sicht stärker für bezahlbaren Wohnraum genutzt werden.", "date": "März 2026", "url": "https://www.linksfraktion-hamburg.de/buendnis-fuer-das-wohnen-viel-zu-wenig-guenstige-wohnungen/"}], "note": ""}}, {"id": "HE", "name": "Hessen", "capital": "Wiesbaden", "city": "Frankfurt am Main", "area": 21116, "pop": 6.28, "leader": "Boris Rhein", "party": "CDU", "coalition": ["CDU", "SPD"], "region": "Mitte", "fact": "In Frankfurt gibt es viele Banken und einen großen Flughafen. Die Hauptstadt ist aber Wiesbaden.", "source": "https://hessen.de/regierung", "note": "", "opposition": {"groups": ["AfD", "Grüne", "FDP"], "source": "https://hessischer-landtag.de/jugend/die-fraktionen", "items": [{"party": "Grüne", "topic": "Bildung: Unterstützung für Schulen", "text": "Die Grünen halten die neuen Hilfen für Schulen für zu klein. Nach ihrer Ansicht gleichen sie die vorherigen Kürzungen nicht aus.", "date": "31. August 2026", "url": "https://www.gruene-hessen.de/landtag/pressemitteilungen/koalition-bricht-ihr-wort-schwarz-rotes-bildungspaeckchen-kann-bildungs-kahlschlag-nicht-annaehernd-ausgleichen/?d=druckvorschau"}, {"party": "FDP", "topic": "Bildung: Kürzungen zurücknehmen", "text": "Die FDP kritisiert Kürzungen an Schulen. Sie fordert, besonders Schulen mit großen sozialen Herausforderungen und integrierte Gesamtschulen ausreichend zu unterstützen.", "date": "18. März 2026", "url": "https://fdp-fraktion-hessen.de/meldung/promny-freie-demokraten-fordern-ruecknahme-der-bildungskuerzungen/"}], "note": ""}}, {"id": "MV", "name": "Mecklenburg-Vorpommern", "capital": "Schwerin", "city": "Rostock", "area": 23294, "pop": 1.57, "leader": "Manuela Schwesig", "party": "SPD", "coalition": ["SPD", "Die Linke"], "region": "Nordosten", "fact": "Das Land liegt an der Ostsee. Dazu gehören die Insel Rügen und viele Seen.", "source": "https://mecklenburg-vorpommern.de/landesregierung/stk", "note": "Nach der Wahl im September 2026 verhandeln SPD, Die Linke und Grüne über eine neue Regierung. Diese ist noch nicht im Amt.", "opposition": {"groups": ["AfD", "CDU", "Grüne", "FDP (Gruppe)"], "source": "https://www.landtag-mv.de/", "items": [{"party": "CDU", "topic": "Umgang mit Geld", "text": "Die CDU findet: Die Regierung plant mehr Ausgaben, als das Land langfristig bezahlen kann. Sie vermisst Antworten auf künftige Finanzprobleme.", "date": "Haushaltsdebatte 2026/2027", "url": "https://www.cdu-fraktion.de/artikel/daniel-peters-dieser-haushalt-lebt-ueber-die-verhaeltnisse-des-landes-und-die"}, {"party": "FDP", "topic": "Reformen statt Schulden", "text": "Die FDP kritisiert, dass die Regierung mit neuen Schulden Probleme nur verschiebt. Sie fordert Veränderungen in Verwaltung und Wirtschaft sowie ein stärkeres Bildungssystem.", "date": "Haushaltsdebatte 2026/2027", "url": "https://www.fdp-mv.de/dieser-haushalt-ist-eine-zahlen-gegossene-realitaetsverweigerung-schulden-ersetzen-keine-reformen"}], "note": "Hier ist noch der bisherige Landtag gemeint. Der neu gewählte Landtag tritt am 20. Oktober 2026 erstmals zusammen. CDU und FDP sind dort nicht mehr vertreten. SPD, Linke und Grüne verhandeln über eine neue Regierung; sie ist noch nicht im Amt."}}, {"id": "NI", "name": "Niedersachsen", "capital": "Hannover", "city": "Hannover", "area": 47710, "pop": 8.0, "leader": "Olaf Lies", "party": "SPD", "coalition": ["SPD", "Grüne"], "region": "Nordwesten", "fact": "Niedersachsen reicht von der Nordsee bis zum Harz. Landwirtschaft und Fahrzeugbau sind wichtig.", "source": "https://www.niedersachsen.de/politik_staat/landesregierung_ministerien/die-niedersachsische-landesregierung-20076.html", "note": "", "opposition": {"groups": ["CDU", "AfD"], "source": "https://www.landtag-niedersachsen.de/fraktionen/", "items": [{"party": "CDU", "topic": "Geld für Städte und Gemeinden", "text": "Die CDU kritisiert am Geldplan für 2027 und 2028: Die Finanzprobleme der Gemeinden bleiben ungelöst. Außerdem werde die Verwaltung nicht ausreichend modernisiert.", "date": "9. September 2026", "url": "https://cdultnds.de/2026/09/09/doppelhaushalt-2027-2028-fehlende-verwaltungsreform-ungeloeste-kommunale-finanzkrise-und-neue-belastungen-fuer-kommende-haushalte/"}, {"party": "AfD", "topic": "Schulden und Verwaltung", "text": "Die AfD kritisiert zusätzliche Stellen in der Verwaltung und neue Schulden. Sie hält auch die geplante Wohnungsbaugesellschaft des Landes für unnötig.", "date": "Juli 2026", "url": "https://www.afd-landtagsfraktion-niedersachsen.de/pressemitteilung/peer-lilienthal-zu-den-haushaltsentwuerfen-der-landesregierung-nein-herr-lies-dieser-haushalt-ist-weder-solide-noch-verlaesslich/"}], "note": ""}}, {"id": "NW", "name": "Nordrhein-Westfalen", "capital": "Düsseldorf", "city": "Köln", "area": 34112, "pop": 17.99, "leader": "Hendrik Wüst", "party": "CDU", "coalition": ["CDU", "Grüne"], "region": "Westen", "fact": "Hier leben mehr Menschen als in jedem anderen Bundesland. Im Ruhrgebiet liegen viele große Städte dicht zusammen.", "source": "https://www.land.nrw/", "note": "", "opposition": {"groups": ["SPD", "FDP", "AfD"], "source": "https://www.landtag.nrw.de/home/aktuelles/meldungen-und-berichte/meldungen-berichte-und-informati/meldungen-und-berichte/2025/12/1712_haushalt_dritte-lesung.html", "items": [{"party": "SPD", "topic": "Bildung und Arbeit", "text": "Die SPD findet: Die Regierung löst wichtige Probleme im Land nicht. Sie fordert mehr Chancen durch Bildung, faire Tariflöhne und Mitbestimmung bei der Arbeit.", "date": "17. Dezember 2025", "url": "https://www.landtag.nrw.de/home/aktuelles/meldungen-und-berichte/meldungen-berichte-und-informati/meldungen-und-berichte/2025/12/1712_haushalt_dritte-lesung.html"}, {"party": "FDP", "topic": "Bildung und Schulden", "text": "Die FDP kritisiert: Trotz hoher Ausgaben und neuer Schulden gebe es zu wenig Fortschritt bei Kitas und Schulen. Sie wendet sich auch gegen Kürzungen an Hochschulen.", "date": "17. Dezember 2025", "url": "https://www.landtag.nrw.de/home/aktuelles/meldungen-und-berichte/meldungen-berichte-und-informati/meldungen-und-berichte/2025/12/1712_haushalt_dritte-lesung.html"}, {"party": "AfD", "topic": "Wirtschaft und Ausgaben", "text": "Die AfD findet: Die Regierung setzt mit Ausgaben für Klimaschutz und Flüchtlingsaufnahme falsche Schwerpunkte. Sie fordert mehr Aufmerksamkeit für Unternehmen und Arbeitsplätze.", "date": "17. Dezember 2025", "url": "https://www.landtag.nrw.de/home/aktuelles/meldungen-und-berichte/meldungen-berichte-und-informati/meldungen-und-berichte/2025/12/1712_haushalt_dritte-lesung.html"}], "note": ""}}, {"id": "RP", "name": "Rheinland-Pfalz", "capital": "Mainz", "city": "Mainz", "area": 19858, "pop": 4.12, "leader": "Gordon Schnieder", "party": "CDU", "coalition": ["CDU", "SPD"], "region": "Westen", "fact": "Rhein und Mosel fließen durch das Land. An ihren Hängen wird viel Wein angebaut.", "source": "https://www.rlp.de/ministerpraesident/staatskanzlei/", "note": "", "opposition": {"groups": ["AfD", "Grüne"], "source": "https://landtag-rlp.de/", "items": [{"party": "AfD", "topic": "Versprechen an Familien", "text": "Die AfD wirft der CDU vor, Wahlversprechen aufgegeben zu haben. Als Beispiel nennt sie eine angekündigte finanzielle Hilfe für Familien beim Kauf eines Eigenheims.", "date": "17. Juni 2026", "url": "https://www.rhein-zeitung.de/rheinland-pfalz/afd-fraktionschef-wolkige-versprechungen-der-regierung_arid-4133818.html"}, {"party": "Grüne", "topic": "Bildung und Klimaschutz", "text": "Die Grünen finden die Pläne der neuen Regierung nicht ehrgeizig genug. Sie kritisieren besonders die angekündigte Bildungs- und Klimaschutzpolitik.", "date": "17. Juni 2026", "url": "https://www.rhein-zeitung.de/rheinland-pfalz/eder-vermisst-positive-zukunftserzaehlung-der-neuen-regierung_arid-4133893.html"}], "note": ""}}, {"id": "SL", "name": "Saarland", "capital": "Saarbrücken", "city": "Saarbrücken", "area": 2572, "pop": 1.01, "leader": "Anke Rehlinger", "party": "SPD", "coalition": ["SPD"], "region": "Südwesten", "fact": "Das Saarland grenzt an Frankreich und Luxemburg. Bekannt ist die große Flussschleife der Saar.", "source": "https://www.saarland.de/", "note": "", "opposition": {"groups": ["CDU", "AfD"], "source": "https://www.sr.de/sr/home/nachrichten/politik_wirtschaft/cdu_aenderung_doppelhaushalt_saarland_2026_2027_100.html", "items": [{"party": "CDU", "topic": "Bildung: Lehrkräfte gewinnen", "text": "Die CDU kritisiert, dass der Regierung ein überzeugender Plan gegen den Mangel an Lehrkräften fehle. Sie fordert klare Antworten für die Schulen.", "date": "August 2026", "url": "https://cdu-fraktion-saar.de/meldungen/rechnungshof-bestaetigt-bildungsministerium-handelt-weiter-ohne-konzept/"}, {"party": "CDU und AfD", "topic": "Umgang mit Geld", "text": "Beide Parteien warfen der SPD-Regierung in der Haushaltsdebatte vor, nicht sorgfältig genug mit den Ausgaben umzugehen. Ihre übrigen Ziele sind deshalb nicht automatisch gleich.", "date": "Haushaltsdebatte 2026/2027", "url": "https://www.sr.de/sr/home/nachrichten/politik_wirtschaft/cdu_aenderung_doppelhaushalt_saarland_2026_2027_100.html"}], "note": ""}}, {"id": "SN", "name": "Sachsen", "capital": "Dresden", "city": "Leipzig", "area": 18450, "pop": 4.03, "leader": "Michael Kretschmer", "party": "CDU", "coalition": ["CDU", "SPD"], "region": "Osten", "fact": "In Sachsen liegen das Erzgebirge und die Sächsische Schweiz. Leipzig ist größer als die Hauptstadt Dresden.", "source": "https://www.sachsen.de/regierung-verwaltung-egovernment.html", "note": "Die Regierungsparteien haben keine eigene Mehrheit im Landtag. Für Beschlüsse brauchen sie auch Stimmen anderer Abgeordneter.", "opposition": {"groups": ["AfD", "BSW", "Grüne", "Die Linke"], "source": "https://www.landtag.sachsen.de/de/parlament/fraktionen/", "items": [{"party": "Die Linke", "topic": "Bildung und Soziales", "text": "Die Linke kritisiert Kürzungen. Sie will mehr Geld für soziale Hilfen, Schulen und die Erneuerung von Straßen und Gebäuden.", "date": "Juni 2025 · Haushalt 2025/2026", "url": "https://www.landtag.sachsen.de/de/aktuelles/plenarsitzungen/juniplenum-2025-31816.cshtml"}, {"party": "Grüne", "topic": "Geld für Gemeinden", "text": "Die Grünen finden: Städte und Gemeinden haben dauerhaft zu wenig Geld für ihre Aufgaben. Hilfen des Bundes allein reichen aus ihrer Sicht nicht aus.", "date": "Juni 2025 · Haushalt 2025/2026", "url": "https://www.landtag.sachsen.de/de/aktuelles/plenarsitzungen/juniplenum-2025-31816.cshtml"}, {"party": "BSW", "topic": "Forschung", "text": "Das BSW kritisiert den Geldplan für Forschung. Es fordert mehr Investitionen in diesen Bereich.", "date": "Juni 2025 · Haushalt 2025/2026", "url": "https://www.landtag.sachsen.de/de/aktuelles/plenarsitzungen/juniplenum-2025-31816.cshtml"}, {"party": "AfD", "topic": "Ausgaben und Migration", "text": "Die AfD kritisiert aus ihrer Sicht zu hohe Ausgaben für Verwaltung, bestimmte Vereine und Asylbewerber. Sie will das Geld anders verteilen.", "date": "26. August 2026", "url": "https://afd-fraktion-sachsen.de/haushalt-regierung-verprasst-steuergeld-fuer-buerokratie-linke-ngos-und-asylbewerber/"}], "note": "CDU und SPD haben im Landtag keine eigene Mehrheit. Sie brauchen für Beschlüsse weitere Stimmen. Oppositionsparteien können einzelne Vorhaben unterstützen und trotzdem Opposition bleiben."}}, {"id": "ST", "name": "Sachsen-Anhalt", "capital": "Magdeburg", "city": "Halle (Saale)", "area": 20555, "pop": 2.12, "leader": "Sven Schulze", "party": "CDU", "coalition": ["CDU", "SPD", "FDP"], "region": "Mitte / Osten", "fact": "Die Elbe fließt durch das Land. Im Harz liegt der Brocken, der höchste Berg Norddeutschlands.", "source": "https://sachsen-anhalt.de/politik-verwaltung/page/die-landesregierung", "note": "Die bisherige Regierung führt die Geschäfte nach der Wahl im September 2026 weiter. Eine neue Regierung ist noch nicht im Amt.", "opposition": {"groups": ["AfD", "Die Linke", "Grüne", "BSW"], "source": "https://www.landtag.sachsen-anhalt.de/landtag/fraktionen", "items": [{"party": "BSW", "topic": "Bildung: Personal an Schulen", "text": "Das BSW beschreibt die Lage an Schulen als schwere Krise. Es fordert weniger Unterrichtsstunden pro Lehrkraft und mehr Vertretung, damit Lehrkräfte entlastet werden.", "date": "2. September 2026 · vor der Wahl", "url": "https://www.zdfheute.de/politik/deutschland/sachsen-anhalt-wahl-2026-bildung-schule-afd-inklusion-cdu-wahlprogramm-100.html"}, {"party": "Grüne und Die Linke", "topic": "Bildung: Ausbildung verändern", "text": "Beide Parteien wollen die Ausbildung von Lehrkräften stärker verändern als die bisherige Regierung. Die Linke fordert zusätzliche Studienplätze. Die Grünen wollen mehr Geld für Lehrkräfte in Regionen mit besonders großem Mangel.", "date": "2. September 2026 · vor der Wahl", "url": "https://www.zdfheute.de/politik/deutschland/sachsen-anhalt-wahl-2026-bildung-schule-afd-inklusion-cdu-wahlprogramm-100.html"}], "note": "Die bisherige Regierung aus CDU, SPD und FDP führt die Geschäfte weiter. Die FDP sitzt nach der Wahl nicht mehr im Landtag. Eine neue Regierung steht noch nicht fest. Die Liste bezieht sich auf die Parteien außerhalb der bisherigen Regierung; die künftigen Rollen können sich ändern."}}, {"id": "SH", "name": "Schleswig-Holstein", "capital": "Kiel", "city": "Kiel", "area": 15804, "pop": 2.96, "leader": "Daniel Günther", "party": "CDU", "coalition": ["CDU", "Grüne"], "region": "Norden", "fact": "Das Land liegt zwischen Nordsee und Ostsee. Im Norden grenzt es an Dänemark.", "source": "https://www.schleswig-holstein.de/DE/landesregierung", "note": "", "opposition": {"groups": ["SPD", "FDP", "SSW"], "source": "https://www.landtag.ltsh.de/abgeordnete/fraktionen/", "items": [{"party": "SPD", "topic": "Finanzen: verlässlich planen", "text": "Die SPD kritisiert, dass ein klarer Plan gegen wachsende Geldprobleme fehle. Viele zusätzliche Kosten seien vorhersehbar gewesen.", "date": "10. März 2026", "url": "https://www.landtag.ltsh.de/presseticker/2026-03-10-13-57-53-496d/"}, {"party": "FDP", "topic": "Schulden und Investitionen", "text": "Die FDP kritisiert die hohe Neuverschuldung. Sie findet: Zu wenig Geld fließt in Vorhaben, die dem Land langfristig helfen.", "date": "Entwurf des Haushalts 2026", "url": "https://www.ndr.de/nachrichten/schleswig-holstein/haushaltsentwurf-2026-sh-zwischen-investitionen-und-spardruck%2Chaushalt-262.html"}, {"party": "SSW", "topic": "Sparpläne verständlich machen", "text": "Der SSW fordert konkrete Angaben dazu, wo die Regierung Geld sparen will. Eine Zahl im Geldplan allein sei noch kein fertiger Sparplan.", "date": "26. August 2026", "url": "https://www.ndr.de/nachrichten/schleswig-holstein/haushaltsentwurf-hier-will-land-2027-sparen-und-investieren,haushalt-330.html"}], "note": "SSW bedeutet Südschleswigscher Wählerverband. Er vertritt besonders die dänische Minderheit und die friesische Volksgruppe. Auch der SSW kann einzelnen Regierungsplänen zustimmen."}}, {"id": "TH", "name": "Thüringen", "capital": "Erfurt", "city": "Erfurt", "area": 16202, "pop": 2.08, "leader": "Mario Voigt", "party": "CDU", "coalition": ["CDU", "Thüringen.Gerecht", "SPD"], "region": "Mitte", "fact": "Thüringen hat viele Wälder. Bekannt sind der Thüringer Wald und die Wartburg bei Eisenach.", "source": "https://www.thueringer-landtag.de/aktuelles/aktuelles/faq-fraktionsbildung/", "note": "Thüringen.Gerecht entstand 2026 nach einer Abspaltung vom BSW. Die Regierung hat keine eigene Mehrheit im Landtag. Für Beschlüsse braucht sie weitere Stimmen.", "opposition": {"groups": ["AfD", "Die Linke", "BSW (zwei Abgeordnete ohne Fraktion)"], "source": "https://www.thueringer-landtag.de/aktuelles/aktuelles/faq-fraktionsbildung/", "items": [{"party": "Die Linke", "topic": "Regieren ohne eigene Mehrheit", "text": "Die Linke fordert nach dem Zerfall der BSW-Fraktion Klarheit: Wie will die Regierung Mehrheiten für Beschlüsse finden? Sie befürchtet, dass die Arbeit des Parlaments sonst stockt.", "date": "5. September 2026", "url": "https://www.deutschlandfunk.de/bsw-fraktion-zerfaellt-zusammenarbeit-mit-der-linkspartei-nun-wichtiger-denn-je-100.html"}, {"party": "AfD", "topic": "Forderung nach einer Neuwahl", "text": "Die AfD kritisiert den Zerfall der früheren BSW-Regierungsfraktion und die Affäre um Voigts Doktorarbeit. Sie wollte deshalb eine Neuwahl. Ihr Antrag zur Auflösung des Landtags scheiterte.", "date": "7. Oktober 2026", "url": "https://www.welt.de/regionales/thueringen/article6ac628b2b7b9a5fe2bbb2781/afd-scheitert-mit-selbstaufloesung-des-thueringer-landtags.html"}], "note": "Die zwei verbliebenen BSW-Abgeordneten haben sich der Opposition zugeordnet. Die drei Abgeordneten des Zusammenschlusses „Deine Stimme zählt“ hatten sich laut Landtag noch nicht eindeutig zugeordnet. Sie sind hier deshalb nicht pauschal als Opposition aufgeführt."}}], "parties": {"CDU": {"color": "#26313d", "full": "Christlich Demokratische Union Deutschlands", "topic": "Wirtschaft & Sicherheit", "text": "Die CDU will Unternehmen stärken und Steuern für Unternehmen senken. Sie setzt auf Sicherheit und eine strengere Begrenzung der Zuwanderung.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/558916/christlich-demokratische-union-deutschlands/", "sections": ["Die CDU will die Zuwanderung stärker begrenzen und Grenzen kontrollieren. Menschen ohne Bleiberecht sollen schneller ausreisen. Gleichzeitig sollen gut ausgebildete Fachkräfte leichter zum Arbeiten nach Deutschland kommen.", "Die CDU will Unternehmen durch niedrigere Steuern und weniger Vorschriften stärken. So sollen Arbeitsplätze entstehen. Beim Mindestlohn soll eine unabhängige Kommission die Höhe vorschlagen. Die Partei unterstützt Tarifverträge: Vereinbarungen über Lohn und Arbeitsbedingungen.", "Die CDU will Klimaziele erreichen und Natur schützen. Sie setzt dabei auf neue Technik und einen Preis für den Ausstoß von CO₂. Unternehmen sollen selbst entscheiden können, wie sie diesen Ausstoß verringern.", "Die CDU will Lesen, Schreiben und Rechnen besonders stärken. Kinder sollen früh Deutsch lernen. Eine berufliche Ausbildung soll genauso viel Anerkennung erhalten wie ein Studium."], "sources": [["Gemeinsames Wahlprogramm 2025", "https://www.cdu.de/wahlprogramm-von-cdu-und-csu/"]], "basis": "Allgemeine Positionen · vor allem Wahlprogramme 2025"}, "CSU": {"color": "#0873a4", "full": "Christlich-Soziale Union in Bayern", "topic": "Bayern & Sicherheit", "text": "Die CSU tritt nur in Bayern an. Sie will Bayerns Interessen stärken. Wichtig sind ihr die Wirtschaft, Sicherheit und eine strengere Begrenzung der Zuwanderung.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/559080/christlich-soziale-union-in-bayern-e-v/", "sections": ["Die CSU will Zuwanderung deutlich begrenzen und Grenzen stärker kontrollieren. Menschen ohne Bleiberecht sollen konsequenter abgeschoben werden. Für benötigte Fachkräfte soll die Einreise einfacher werden.", "Die CSU will Unternehmen und Handwerksbetriebe entlasten, damit Arbeitsplätze erhalten bleiben. Beschäftigte sollen durch niedrigere Steuern mehr von ihrem Verdienst behalten. Wie die CDU unterstützt sie den Mindestlohn und Tarifverträge; die Mindestlohnkommission soll die Lohnuntergrenze vorschlagen.", "Die CSU will Klimaschutz mit einer starken Wirtschaft verbinden. Sie setzt auf neue Technik und verschiedene Energiequellen. Natur und Landschaft sollen geschützt werden. Die Kosten für Haushalte und Betriebe sollen bezahlbar bleiben.", "Die CSU betont Leistung und unterschiedliche Schularten. Lesen, Schreiben und Rechnen sind ihr wichtig. Sie will auch die berufliche Ausbildung stärken. Ihre Bildungspolitik bezieht sich besonders auf Bayern."], "sources": [["Gemeinsames Wahlprogramm 2025", "https://www.cdu.de/wahlprogramm-von-cdu-und-csu/"]], "basis": "Allgemeine Positionen · vor allem Wahlprogramme 2025"}, "SPD": {"color": "#c83242", "full": "Sozialdemokratische Partei Deutschlands", "topic": "Löhne & soziale Sicherheit", "text": "Die SPD will höhere Löhne und verlässliche Renten. Menschen mit kleinen und mittleren Einkommen sollen entlastet werden. Sie will bezahlbares Wohnen fördern.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/558913/sozialdemokratische-partei-deutschlands/", "sections": ["Die SPD will Menschen schützen, die vor Verfolgung fliehen. Sprachkurse und Arbeit sollen beim Ankommen helfen. Zugleich fordert sie geordnete Verfahren und konsequente Abschiebungen, besonders von Straftätern ohne Bleiberecht.", "Die SPD will höhere Mindestlöhne und mehr Tarifverträge. Beschäftigte sollen verlässlich bezahlt werden und sichere Arbeitsplätze haben. Arbeitsverträge ohne sachlichen Grund nur befristet abzuschließen, lehnt sie ab. Kleine und mittlere Einkommen will sie steuerlich entlasten.", "Die SPD will mehr Strom aus Wind und Sonne sowie klimafreundliche Betriebe. Der Umbau soll Arbeitsplätze sichern. Menschen mit wenig Geld sollen Unterstützung erhalten, damit sie die Veränderungen bezahlen können.", "Die SPD will gut ausgestattete Schulen und mehr Ganztagsangebote. Schulen mit besonders vielen benachteiligten Kindern sollen zusätzliche Hilfe bekommen. Bildungschancen sollen weniger vom Einkommen der Eltern abhängen."], "sources": [["Programm: Arbeit und Bildung", "https://www.spd.de/bundestagswahl/programm/uebersicht/ii-ein-neuer-aufschwung-fuer-deutschland"]], "basis": "Allgemeine Positionen · vor allem Wahlprogramme 2025"}, "Grüne": {"color": "#35794c", "full": "Bündnis 90/Die Grünen", "topic": "Klima & gleiche Rechte", "text": "Die Grünen wollen Klima und Natur schützen. Sie setzen auf Strom aus Wind und Sonne. Gleiche Rechte und gute Bus- und Bahnverbindungen sind ihnen wichtig.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/558917/buendnis-90-die-gruenen/", "sections": ["Die Grünen wollen das Recht auf Asyl schützen. Das bedeutet Schutz vor Verfolgung. Sie wollen Familien zusammenführen und Sprachkurse stärken. Zugewanderte Menschen sollen leichter arbeiten und ihre Berufsabschlüsse anerkennen lassen können.", "Die Grünen wollen höhere Mindestlöhne, mehr Tarifverträge und gleichen Lohn für gleichwertige Arbeit. Sie wollen Beschäftigte beim Wechsel zu klimafreundlichen Betrieben unterstützen. Investitionen in neue Technik sollen gute Arbeitsplätze schaffen.", "Die Grünen wollen den Ausstoß klimaschädlicher Gase stark senken. Sie setzen auf Wind- und Sonnenenergie sowie bessere Bus- und Bahnverbindungen. Auch Tiere, Pflanzen und ihre Lebensräume sollen besser geschützt werden.", "Die Grünen wollen mehr Geld für Kitas und Schulen einsetzen. Gebäude und Ausstattung sollen verbessert werden. Kinder sollen gute Lernchancen haben, unabhängig davon, wie viel Geld ihre Eltern verdienen."], "sources": [["Regierungsprogramm 2025", "https://www.gruene-blk.de/btw25"]], "basis": "Allgemeine Positionen · vor allem Wahlprogramme 2025"}, "FDP": {"color": "#927500", "full": "Freie Demokratische Partei", "topic": "Freiheit & weniger Regeln", "text": "Die FDP will, dass Menschen und Unternehmen möglichst viel selbst entscheiden. Sie fordert niedrigere Steuern und weniger Vorschriften. Digitale Technik soll den Alltag erleichtern.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/558918/freie-demokratische-partei/", "sections": ["Die FDP will die Einwanderung von Fachkräften erleichtern. Zuwanderung ohne geregelte Erlaubnis will sie begrenzen. Menschen ohne Bleiberecht sollen konsequenter zurückgeführt werden. Wer bleibt, soll Deutsch lernen und möglichst selbst für seinen Lebensunterhalt sorgen.", "Die FDP will niedrigere Steuern und weniger Vorschriften für Betriebe. Das soll Investitionen und Arbeitsplätze fördern. Sie will flexiblere Arbeitszeiten: eine Höchstgrenze pro Woche statt pro Tag. Den Mindestlohn soll weiterhin die unabhängige Kommission vorschlagen.", "Die FDP will Klimaschutz vor allem durch neue Technik und den Handel mit begrenzten CO₂-Rechten erreichen. Wer viel CO₂ ausstößt, muss dafür zahlen. Die Partei möchte weniger Vorgaben für einzelne Technologien.", "Die FDP will digitale Schulen und mehr Förderung schon vor der Einschulung. Abschlüsse sollen bundesweit besser vergleichbar sein. Schulen sollen mehr selbst entscheiden können. Auch Technik und wirtschaftliches Wissen sind ihr wichtig."], "sources": [["Wahlprogramm 2025", "https://www.fdp.de/das-wahlprogramm-der-freien-demokraten-zur-bundestagswahl-2025"]], "basis": "Allgemeine Positionen · vor allem Wahlprogramme 2025"}, "Die Linke": {"color": "#ac2863", "full": "Die Linke", "topic": "Wohnen & soziale Gerechtigkeit", "text": "Die Linke will niedrigere Mieten und mehr Geld für Menschen mit wenig Einkommen. Sehr reiche Menschen sollen mehr Steuern zahlen. Sie setzt sich für Abrüstung ein.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/558920/die-linke/", "sections": ["Die Linke will das Recht auf Asyl und sichere Fluchtwege schützen. Zugewanderte Menschen sollen gleichberechtigt teilhaben können. Städte und Gemeinden sollen mehr Unterstützung für Aufnahme, Wohnen und Integration bekommen.", "Die Linke will deutlich höhere Mindestlöhne und stärkere Rechte für Beschäftigte. Sie unterstützt kürzere Arbeitszeiten bei gleichem Lohn. Tarifverträge und Gewerkschaften sollen gestärkt werden. Menschen mit niedrigen Einkommen sollen weniger, sehr reiche Menschen mehr Steuern zahlen.", "Die Linke will verbindliche Klimaschutzregeln und mehr öffentlichen Nahverkehr. Besonders klimaschädlicher Luxus soll stärker begrenzt werden. Menschen mit wenig Geld sollen bei den Kosten für Klimaschutz entlastet werden.", "Die Linke will kostenfreie Bildung und längeres gemeinsames Lernen. Schulessen und Schulwege sollen Familien nichts kosten. Kinder sollen unabhängig vom Einkommen ihrer Eltern gute Lernchancen erhalten."], "sources": [["Wahlprogramm 2025", "https://www.die-linke.de/bundestagswahl-2025/wahlprogramm/"], ["Bildung: 5-Punkte-Plan", "https://www.die-linke.de/start/presse/detail/news/5-punkte-plan-gleiche-bildungschancen-fuer-alle-jetzt/"]], "basis": "Allgemeine Positionen · vor allem Wahlprogramme 2025"}, "FREIE WÄHLER": {"color": "#b65a16", "full": "FREIE WÄHLER", "topic": "Gemeinden & Mitbestimmung", "text": "Die FREIEN WÄHLER wollen Städte und Gemeinden stärken. Mehr Entscheidungen sollen vor Ort fallen. Sie setzen sich auch für mehr direkte Mitbestimmung ein.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/558922/freie-waehler/", "sections": ["Die FREIEN WÄHLER wollen Zuwanderung steuern und Asylverfahren beschleunigen. Fachkräfte sollen leichter kommen können. Wer sich integriert, soll schneller Zugang zu Arbeit oder Ausbildung bekommen. Den Familiennachzug wollen sie begrenzen.", "Die FREIEN WÄHLER wollen Betriebe und Arbeitsplätze vor Ort stärken. Weiterbildung soll Beschäftigte auf neue Aufgaben vorbereiten. Sie fordern gleichen Lohn für gleiche Arbeit und mehr zeitliche und räumliche Flexibilität beim Arbeiten.", "Die FREIEN WÄHLER wollen Wasser, Böden und Landschaften schützen. Es sollen weniger neue Flächen bebaut werden. Gemeinden sollen beim Hochwasserschutz unterstützt werden. Umwelt- und Tierschutzleistungen der Landwirtschaft sollen besser bezahlt werden.", "Die FREIEN WÄHLER wollen kleinere Klassen, mehr Lehrkräfte und mehr Schulsozialarbeit. Auch die berufliche Bildung ist ihnen wichtig. In Bayern setzen sie sich für kostenlose Meisterausbildung und Fortbildung ein."], "sources": [["Migration", "https://www.fw-bayern.de/unsere-politik/starker-staat"], ["Arbeit und Digitalisierung", "https://www.fw-bayern.de/unsere-politik/digitalezukunft"], ["Soziale Sicherheit", "https://www.fw-bayern.de/unsere-politik/soziale-sicherheit"], ["Umwelt", "https://www.fw-bayern.de/unsere-politik/gesunde-umwelt"], ["Bildung", "https://www.fw-bayern.de/unsere-politik/beste-bildung"]], "basis": "Schwerpunkte der FREIEN WÄHLER Bayern · recherchiert am 13.10.2026"}, "AfD": {"color": "#187cb2", "full": "Alternative für Deutschland", "topic": "Zuwanderung & nationale Politik", "text": "Die AfD will deutlich weniger Zuwanderung und weniger Einfluss der Europäischen Union. Sie lehnt viele staatliche Klimaschutzmaßnahmen ab. Sie will nationale Entscheidungen stärken.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/558919/alternative-fuer-deutschland/", "sections": ["Die AfD will Zuwanderung stark begrenzen. Sie fordert Zurückweisungen von Asylsuchenden an den Grenzen und mehr Abschiebungen. Bleibemöglichkeiten für Menschen, die ausreisen müssen, will sie weitgehend abschaffen.", "Die AfD will Steuern senken und Unternehmen von Vorschriften entlasten. Den gesetzlichen Mindestlohn will sie beibehalten. Wer länger Bürgergeld bezieht, soll nach ihrem Programm zu gemeinnütziger Arbeit verpflichtet werden. Das soll nach ihrer Vorstellung den Anreiz zur Erwerbsarbeit erhöhen.", "Die AfD lehnt viele Klimaschutzmaßnahmen und die CO₂-Abgabe ab. Sie will wieder Atomkraft nutzen und weiter auf Kohle und Gas setzen. Sie bestreitet den menschengemachten Klimawandel; das widerspricht dem wissenschaftlichen Konsens.", "Die AfD will unterschiedliche Schularten und eine starke Orientierung an Leistung und Noten. Auch Förderschulen sollen erhalten bleiben. Sie will die berufliche Ausbildung stärken."], "sources": [["Arbeitsmarkt: eigene Position", "https://www.afd.de/portfolio-items/arbeitsmarkt-und-sozialpolitik/"], ["Einordnung des Wahlprogramms 2025", "https://www.bundestagswahl-bw.de/wahlprogramm-afd"]], "basis": "Allgemeine Positionen · vor allem Wahlprogramme 2025"}, "BSW": {"color": "#79436b", "full": "Bündnis Sahra Wagenknecht", "topic": "Soziale Sicherheit & Außenpolitik", "text": "Das BSW will höhere Löhne und Renten. Es fordert weniger Zuwanderung. Waffenlieferungen an die Ukraine lehnt es ab und setzt stattdessen auf Verhandlungen.", "source": "https://www.bpb.de/themen/parteien/wer-steht-zur-wahl/bundestagswahl-2025/558940/buendnis-sahra-wagenknecht-vernunft-und-gerechtigkeit/", "sections": ["Das BSW will Zuwanderung stärker begrenzen und Abschiebungen konsequenter durchführen. Wer über ein sicheres Drittland kommt, soll nach seiner Forderung grundsätzlich kein Aufenthaltsrecht erhalten. Es betont die Belastung von Städten und Gemeinden.", "Das BSW will höhere Mindestlöhne und bessere soziale Absicherung. Kleinere und mittlere Betriebe sollen gestärkt werden. Wichtige Bereiche wie Wohnen, Gesundheit und Energie sollen stärker dem Gemeinwohl dienen, also den Bedürfnissen der Menschen statt vor allem dem Gewinn.", "Das BSW betont günstige Energiepreise. Es will auch Öl und Gas weiter nutzen und wieder aus Russland beziehen. Das geplante Ende neuer Autos mit herkömmlichen Verbrennungsmotoren lehnt es ab. E-Autos für Menschen mit wenig Einkommen will es fördern.", "Das BSW fordert bundesweit einheitliche Lehrpläne und Prüfungen. Kinder sollen unabhängig vom Wohnort vergleichbare Anforderungen haben. Bildung soll dem Gemeinwohl dienen und nicht vor allem wirtschaftlichen Interessen."], "sources": [], "basis": "Allgemeine Positionen · vor allem Wahlprogramme 2025"}, "Thüringen.Gerecht": {"color": "#645196", "full": "Thüringen.Gerecht", "topic": "Gerechtigkeit & Umwelt", "text": "Die 2026 gegründete Partei will soziale Gerechtigkeit und die Interessen Ostdeutschlands stärken. Nach Aussagen ihrer Vorsitzenden sind auch Naturschutz und gleiche Rechte für Frauen und Männer wichtig.", "source": "https://www.diethueringer.de/politik/thueringens-finanzministerin-wolf-stellt-programm-der-neuen-partei-thueringen-gerec-3187573", "sections": ["Die Partei ist erst 2026 entstanden. In den hier ausgewerteten Quellen ist noch keine ausreichend konkrete eigene Position zur Migration beschrieben. Positionen ihrer früheren Partei BSW werden deshalb nicht automatisch übernommen.", "Thüringen.Gerecht nennt soziale Gerechtigkeit und wirtschaftliche Stärke als Ziele. Die Interessen Ostdeutschlands sollen stärker berücksichtigt werden. Konkrete eigene Forderungen zu Mindestlohn oder Arbeitszeiten sind in den ausgewerteten Quellen noch nicht ausreichend beschrieben.", "Die Vorsitzende Katja Wolf betont Naturschutz und eine umweltverträgliche Zukunft. Diese Themen sollen nach ihren Aussagen stärker im Mittelpunkt stehen als beim BSW. Ausführliche eigene Maßnahmen sind in den ausgewerteten Quellen noch nicht belegt.", "Bildung wird auf der Website der neuen Partei als Thema genannt. Konkrete eigene Pläne für Schulen oder Ausbildung sind in den hier ausgewerteten Quellen noch nicht ausreichend beschrieben."], "sources": [["Website der Partei", "https://thueringen-gerecht.de/"]], "basis": "Neue Partei · Aussagen und Quellenstand vom 13.10.2026"}}};
const states=DATA.states,parties=DATA.parties,main=document.querySelector('#main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,text)=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)} ↗</a>`;
const topicNames=['Migration','Wirtschaft und Arbeit','Umwelt und Klima','Bildung'];
const card=p=>{const a=parties[p];return `<article class="partycard" style="--pc:${a.color}"><h3>${esc(p)}</h3><span class="full">${esc(a.full)}</span><p class="profile-basis">${esc(a.basis)}</p>${a.sections.map((t,i)=>`<section class="policy-section"><h4><span class="topic-number" aria-hidden="true">0${i+1}</span>${topicNames[i]}</h4><p>${esc(t)}</p></section>`).join('')}<details class="profile-sources"><summary>Quellen zu diesem Profil</summary><ul><li>${link(a.source,p==='Thüringen.Gerecht'?'Bericht zu den Parteizielen':'Kurzprofil der Bundeszentrale für politische Bildung')}</li>${a.sources.map(s=>`<li>${link(s[1],s[0])}</li>`).join('')}</ul><p class="footnote">Forderungen sind keine geltenden Gesetze. Die Zusammenfassung ist eine Auswahl und keine Wahlempfehlung.</p></details></article>`};
const topicGuide=`<section class="topic-guide" aria-labelledby="topics-title"><p class="eyebrow">Vier Themen · Kurz erklärt</p><h2 id="topics-title">Worum geht es in diesen Bereichen?</h2><div class="topic-guide-grid"><article><span class="topic-number">01</span><h3>Migration</h3><p>Menschen ziehen in ein anderes Land, zum Beispiel für Arbeit, Familie oder Schutz vor Krieg und Verfolgung. Politik entscheidet über Einreise, Aufenthalt und Unterstützung beim Ankommen.</p><p class="example"><strong>Zum Beispiel:</strong> Wer darf bleiben? Wer bekommt einen Deutschkurs?</p></article><article><span class="topic-number">02</span><h3>Wirtschaft und Arbeit</h3><p>Hier geht es um Betriebe, Arbeitsplätze und Geld. Dazu gehören der Verdienst und die Rechte von Beschäftigten, etwa bei Arbeitszeit, Urlaub oder Kündigung.</p><p class="example"><strong>Zum Beispiel:</strong> Wie viel verdient man? Wie lange darf man arbeiten?</p></article><article><span class="topic-number">03</span><h3>Umwelt und Klima</h3><p>Hier geht es um den Schutz von Luft, Wasser, Böden, Tieren und Pflanzen. Klimaschutz soll die Erderwärmung begrenzen. Auch Strom und Verkehr gehören dazu.</p><p class="example"><strong>Zum Beispiel:</strong> Woher kommt unser Strom? Wie schützen wir Wälder?</p></article><article><span class="topic-number">04</span><h3>Bildung</h3><p>Bildung bedeutet Lernen – in Kita, Schule, Ausbildung, Studium und später im Beruf. Politik entscheidet mit über Ausstattung, Personal und Unterstützung beim Lernen.</p><p class="example"><strong>Zum Beispiel:</strong> Wie groß sind Klassen? Welche Lernhilfen gibt es?</p></article></div><div class="responsibility"><h3>Wer darf darüber entscheiden?</h3><p>Für Schulen sind vor allem die Bundesländer zuständig. Viele Regeln zu Einwanderung, Arbeitsrecht und Mindestlohn gelten dagegen für ganz Deutschland. Umweltpolitik ist eine gemeinsame Aufgabe von Gemeinden, Ländern, Bund und EU. Eine Landesregierung kann deshalb nicht alle Parteiziele allein umsetzen.</p></div><details class="word-help"><summary>Drei Wörter aus der Arbeitswelt</summary><dl><dt>Mindestlohn</dt><dd>Eine gesetzliche Untergrenze: So viel Geld muss es mindestens für eine Arbeitsstunde geben. Es gibt einzelne Ausnahmen.</dd><dt>Gewerkschaft</dt><dd>Ein Zusammenschluss von Beschäftigten. Gemeinsam setzen sie sich zum Beispiel für bessere Bezahlung und Arbeitsbedingungen ein.</dd><dt>Tarifvertrag</dt><dd>Eine Vereinbarung zwischen einer Gewerkschaft und Arbeitgebern. Darin steht zum Beispiel, wie hoch der Lohn ist und wie lange gearbeitet wird.</dd></dl></details></section>`;

function setNav(mode){document.querySelector('#homeNav').classList.toggle('active',mode!=='parties');document.querySelector('#partyNav').classList.toggle('active',mode==='parties');document.querySelector('#homeNav').setAttribute('aria-current',mode!=='parties'?'page':'false');document.querySelector('#partyNav').setAttribute('aria-current',mode==='parties'?'page':'false')}
const basics=`<section class="basics" aria-label="Politik kurz erklärt"><div><h3>Was ist ein Bundesland?</h3><p>Deutschland besteht aus 16 Bundesländern. Jedes Land hat ein eigenes Parlament und eine eigene Regierung.</p></div><div><h3>Was macht die Regierung?</h3><p>Sie gestaltet die Politik im Land. Sie kümmert sich zum Beispiel um Schulen und die Polizei.</p></div><div><h3>Was ist eine Koalition?</h3><p>Mehrere Parteien regieren zusammen. Dafür vereinbaren sie gemeinsame Ziele. Das nennt man eine Koalition.</p></div></section>`;
function home(){setNav('home');document.title='Länder entdecken · Deutschland & Politik';main.innerHTML=`<section class="intro"><div><p class="eyebrow">Dein Überblick · Deutschland</p><h1>16 Länder.<br>Viele Ideen.<br>Eine Demokratie.</h1><p>Wer regiert wo? Und was wollen die Parteien?<br>Wähle ein Bundesland und finde es heraus.</p><div class="strip"><span class="pill">Kurze Texte</span><span class="pill">Einfache Sprache</span><span class="pill">Alle 16 Länder</span></div></div><div class="intro-art"><span class="big16" aria-hidden="true">16</span><strong>Ein Land. Viele Perspektiven.</strong><p>Von der Küste bis zu den Alpen: Entdecke Politik vor deiner Haustür.</p></div></section><section aria-labelledby="overview"><div class="tools"><h2 id="overview">Wo möchtest du starten?</h2><input class="search" type="search" id="search" aria-label="Bundesland suchen" placeholder="Bundesland suchen …"></div><div id="stateGrid" class="grid"></div><p id="count" class="footnote" aria-live="polite"></p></section>${topicGuide}${basics}<details><summary>Quellen & Stand der Informationen</summary><p>Die Regierungsangaben wurden für den 13. Oktober 2026 recherchiert. Nach Wahlen kann die bisherige Regierung weiter im Amt sein. Die Seite aktualisiert sich nicht selbst.</p><p>Einwohnerzahlen: Jahresstand 2025, auf zwei Dezimalstellen in Millionen gerundet. Flächen: Stand 31.12.2024, auf ganze km² gerundet.</p><ul><li>${link('https://www.statistikportal.de/de/bevoelkerung/flaeche-und-bevoelkerung','Statistische Ämter: Einwohnerzahlen')}</li><li>${link('https://genesis.destatis.de/datenbank/online/statistic/33111/table/33111-0008','Destatis: Flächen der Länder')}</li><li>${link('https://de.wikipedia.org/wiki/Landesregierung_(Deutschland)','Übersicht der Landesregierungen')}</li><li>Weitere Quellen stehen beim jeweiligen Bundesland und bei jeder Partei.</li></ul></details>`;drawStates('');document.querySelector('#search').addEventListener('input',e=>drawStates(e.target.value))}
function drawStates(q){const found=states.filter(s=>s.name.toLocaleLowerCase('de').includes(q.trim().toLocaleLowerCase('de')));document.querySelector('#stateGrid').innerHTML=found.length?found.map(s=>`<button class="state" data-state="${s.id}"><span class="state-top"><span class="abbr">${s.id}</span><span class="arrow" aria-hidden="true">↗</span></span><strong>${esc(s.name)}</strong><small>${esc(s.capital)} · ${esc(s.region)}</small><span class="dots" aria-hidden="true">${s.coalition.map(p=>`<span class="dot" style="background:${parties[p].color}"></span>`).join('')}</span></button>`).join(''):'<p class="empty">Kein Bundesland gefunden. Versuche einen anderen Namen.</p>';document.querySelector('#count').textContent=found.length+' von 16 Bundesländern';document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>go(b.dataset.state))}
function opposition(s){const o=s.opposition;return `<section class="opposition" aria-labelledby="opposition-title"><p class="eyebrow">Kontrollieren · kritisieren · mitgestalten</p><h2 id="opposition-title">Wer ist die Opposition?</h2><p class="explain">Diese Parteien und Gruppen im Landesparlament gehören nicht zur Regierung:</p><div class="party-badges">${o.groups.map(p=>`<span class="badge" style="--pc:${parties[p]?.color||'#64736c'}">${esc(p)}</span>`).join('')}</div>${o.note?`<p class="note">${esc(o.note)}</p>`:''}<p class="explain">Die Opposition kontrolliert die Regierung und macht eigene Vorschläge. Ihre Parteien müssen sich nicht einig sein. Sie können auch einem Vorschlag der Regierung zustimmen.</p><h3>Was kritisiert sie? Beispiele</h3><p class="explain">Hier stehen ausgewählte Positionen einzelner Parteien. Es sind ihre Bewertungen und Forderungen, keine gemeinsame Meinung der gesamten Opposition.</p>${o.items.map(c=>`<article class="criticism"><span class="pill">${esc(c.party)}</span><h3>${esc(c.topic)}</h3><p>${esc(c.text)}</p><p class="footnote">${esc(c.date)} · ${link(c.url,'Quelle zur Aussage')}</p></article>`).join('')}<details><summary>Einordnung & Quellen</summary><p class="explain">Auswahl von Kritik und Gegenvorschlägen aus 2025 und 2026. Nicht jede Partei und jedes Thema ist mit einem Beispiel vertreten. Ältere Aussagen beziehen sich auf die damalige Debatte; Pläne können sich geändert haben. Die Regierung kann diese Bewertungen anders sehen.</p><p class="explain">Eine Fraktion ist eine Gruppe von Abgeordneten im Parlament. Hier stehen vor allem Fraktionen und parlamentarische Gruppen. Einzelne Abgeordnete ohne Fraktion können ebenfalls zur Opposition gehören.</p><p class="explain">Ein Haushalt ist der Geldplan des Landes: Wofür wird Geld ausgegeben und woher kommt es?</p><p>${link(o.source,'Parlament / Zusammensetzung und Debatte')}${s.id==='MV'?`<br>${link('https://www.landtag-mv.de/aktuelles/artikel/neuer-landtag-kommt-am-20-oktober-2026-zur-konstituierenden-sitzung-zusammen','Erste Sitzung des neuen Landtags: 20.10.2026')}`:''}${s.id==='BB'?`<br>${link('https://www.welt.de/regionales/berlin/article6a33fd1646cd409e901a5fc0/drei-brandenburger-ex-bsw-abgeordnete-sind-jetzt-eine-gruppe.html','Einordnung: Wir für Brandenburg')}`:''}</p><p class="footnote">Zuordnung geprüft am 13. Oktober 2026. Diese Datei aktualisiert sich nicht automatisch.</p></details></section>`}
function detail(id){const s=states.find(s=>s.id===id);if(!s){home();return}setNav('home');document.title=s.name+' · Länder entdecken';let role=s.id==='BE'?'Regierender Bürgermeister':s.id==='HB'?'Bürgermeister und Präsident des Senats':s.id==='HH'?'Erster Bürgermeister':['MV','SL'].includes(s.id)?'Ministerpräsidentin':'Ministerpräsident';main.innerHTML=`<div class="crumb"><button class="smallbtn" id="back">← Alle Bundesländer</button><select id="switch" aria-label="Bundesland wechseln">${states.map(t=>`<option value="${t.id}" ${t.id===id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><section class="detail-head"><span class="eyebrow">${esc(s.region)} · ${s.id}</span><h1>${esc(s.name)}</h1><p>${esc(s.fact)}</p></section><section class="stats" aria-label="Das Land in Zahlen"><div class="stat"><span>Hauptstadt</span><strong>${esc(s.capital)}</strong></div><div class="stat"><span>Einwohnerinnen und Einwohner</span><strong>ca. ${s.pop.toLocaleString('de-DE',{minimumFractionDigits:2})} Mio.</strong><small>Jahresstand 2025 · gerundet</small></div><div class="stat"><span>Fläche</span><strong>ca. ${s.area.toLocaleString('de-DE')} km²</strong><small>Stand 2024 · gerundet</small></div><div class="stat"><span>Größte Stadt</span><strong>${esc(s.city)}</strong><small>nach Einwohnerzahl</small></div></section><div class="two"><div class="government-stack"><section class="panel"><h2>Wer regiert?</h2><p class="label">${role}</p><p class="leader">${esc(s.leader)}</p><p>Partei: <strong>${esc(s.party)}</strong></p><p class="label">${['BE','HB','HH'].includes(id)?'Parteien im Senat':'Parteien in der Regierung'}</p><div class="party-badges">${s.coalition.map(p=>`<span class="badge" style="--pc:${parties[p].color}">${esc(p)}</span>`).join('')}</div><p class="explain">${s.coalition.length===1?'Die SPD regiert hier allein. Sie braucht keinen Koalitionspartner.':'Diese Parteien regieren gemeinsam. Ihr Bündnis nennt man eine Koalition.'}</p>${s.note?`<p class="note"><strong>Aktuell wichtig</strong><br>${esc(s.note)}</p>`:''}<p class="footnote">Stand: 13. Oktober 2026</p></section>${opposition(s)}</div><section><h2>Wofür stehen diese Parteien?</h2><p class="explain">Hier liest du Ziele der Regierungsparteien zu vier Themen. Es sind allgemeine Parteipositionen, keine bereits beschlossenen Gesetze. Schulen sind vor allem Ländersache. Viele Regeln zu Migration und Arbeit werden bundesweit entschieden.</p>${s.coalition.map(card).join('')}<p class="footnote">Die Texte beschreiben allgemeine Positionen, nicht den vollständigen Koalitionsvertrag. Landesprogramme können andere Schwerpunkte setzen.</p></section></div><section class="basics"><div><h3>Regierung</h3><p>Sie setzt Politik um und schlägt Gesetze vor.</p></div><div><h3>Parlament</h3><p>Hier beraten und entscheiden gewählte Abgeordnete über Gesetze. Sie kontrollieren die Regierung.</p></div><div><h3>Opposition</h3><p>Das sind die Parteien im Parlament, die nicht mitregieren. Sie prüfen und kritisieren die Regierung.</p></div></section><details><summary>Quellen & Hinweise zu ${esc(s.name)}</summary><ul><li>${link(s.source,'Regierung / offizielle Informationen')}</li><li>${link('https://de.wikipedia.org/wiki/Landesregierung_(Deutschland)','Übersicht der amtierenden Landesregierungen')}</li><li>${link('https://www.statistikportal.de/de/bevoelkerung/flaeche-und-bevoelkerung','Bevölkerung: Statistische Ämter, 2025')}</li><li>${link('https://genesis.destatis.de/datenbank/online/statistic/33111/table/33111-0008','Flächen: Destatis, 2024')}</li>${id==='MV'?`<li>${link('https://www.welt.de/article6acc387e61b3d4c01d3e3a94','Koalitionsverhandlungen, 12.10.2026')}</li>`:''}${id==='BE'?`<li>${link('https://www.welt.de/regionales/rheinland-pfalz-saarland/article6acce26ab52dabc39e80e147/schnieder-fordert-verlaessliches-handeln-der-bundesregierung.html','Regierungsbildung nach der Berliner Wahl, 12.10.2026')}</li>`:''}${id==='ST'?`<li>${link('https://www.welt.de/regionales/sachsen-anhalt/article6ac7b88a79dbba342d2943db/sachsen-anhalt-laesst-vorgehen-zu-ukraine-antrag-offen.html','Geschäftsführende Regierung, 08.10.2026')}</li>`:''}</ul><p>Die Parteitexte beruhen auf Kurzprofilen der Bundeszentrale für politische Bildung, Wahlprogrammen 2025 und den unter jedem Profil verlinkten Themenpapieren. Bei FREIEN WÄHLERN werden Schwerpunkte aus Bayern beschrieben. Für Thüringen.Gerecht sind die Aussagen teilweise noch wenig konkret; solche Lücken sind ausdrücklich markiert. Recherche: 13.10.2026. Landesprogramme können abweichen. Diese Lernseite gibt keine Wahlempfehlung.</p></details><div class="jump"><button class="smallbtn" id="prev">← Vorheriges Land</button><button class="smallbtn" onclick="window.print()">Drucken</button><button class="smallbtn" id="next">Nächstes Land →</button></div>`;document.querySelector('#back').onclick=()=>go('');document.querySelector('#switch').onchange=e=>go(e.target.value);let i=states.indexOf(s);document.querySelector('#prev').onclick=()=>go(states[(i+15)%16].id);document.querySelector('#next').onclick=()=>go(states[(i+1)%16].id)}
function partyPage(){setNav('parties');document.title='Parteien verstehen · Länder entdecken';main.innerHTML=`<p class="eyebrow">Politik kurz erklärt</p><h1>Parteien haben<br>unterschiedliche Ziele.</h1><p style="max-width:760px">Eine Partei ist eine Gruppe von Menschen mit gemeinsamen politischen Ideen. Hier findest du eine Auswahl wichtiger Parteien – auch solche, die in keinem der hier gezeigten Länder mitregieren.</p><p class="explain">Alle Profile haben dieselben vier Themen. Grundlage sind vor allem Wahlprogramme 2025; die Quellen stehen unter jedem Profil. Landesprogramme können abweichen. Parteiziele sind keine geltenden Gesetze und diese Seite gibt keine Wahlempfehlung.</p><div class="partygrid">${Object.keys(parties).map(card).join('')}</div>${basics}`}
function route(focus=true){let id=decodeURIComponent(location.hash.slice(1));if(id==='parteien')partyPage();else if(id)detail(id);else home();if(focus){window.scrollTo(0,0);main.focus({preventScroll:true})}}
function go(id){if(location.hash.slice(1)===id){route();return}location.hash=id}
document.querySelector('#homeNav').onclick=()=>go('');document.querySelector('#partyNav').onclick=()=>go('parteien');window.addEventListener('hashchange',()=>route());route(false);
</script></body></html>
